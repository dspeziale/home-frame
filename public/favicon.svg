<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#grad)" />
  
  <!-- Stylized Camera & Real Estate Home Icon -->
  <g filter="url(#shadow)" transform="translate(56, 56) scale(0.78)">
    <!-- House roof contour -->
    <path d="M 256 40 L 440 200 L 380 200 L 380 440 L 132 440 L 132 200 L 72 200 Z" fill="#ffffff" opacity="0.15"/>
    <path d="M 256 60 L 420 200 L 390 200 L 256 90 L 122 200 L 92 200 Z" fill="#ffffff"/>
    
    <!-- Camera Body -->
    <rect x="100" y="210" width="312" height="230" rx="40" fill="#ffffff"/>
    <rect x="190" y="170" width="132" height="40" rx="16" fill="#ffffff"/>
    <circle cx="360" cy="245" r="14" fill="#2563eb"/>

    <!-- Lens & Aperture -->
    <circle cx="256" cy="325" r="75" fill="#0f172a"/>
    <circle cx="256" cy="325" r="60" fill="#1e293b"/>
    <circle cx="256" cy="325" r="45" fill="#2563eb"/>
    <circle cx="240" cy="310" r="12" fill="#ffffff" opacity="0.8"/>
  </g>
</svg>
